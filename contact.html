<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | The Scholars BD</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="contact"><div id="site-header"></div><main><section class="page-hero container"><span class="eyebrow">WE'RE HERE TO HELP</span><h1>Let's <em>connect.</em></h1><p>Send a message using the local demo form, or add verified official contact details below.</p></section><section class="section container split"><div><span class="eyebrow">CONTACT DETAILS</span><h2>Talk to <em>our team.</em></h2><div class="contact-detail"><span>✉</span><div><small>EMAIL</small><b>Add official email address</b></div></div><div class="contact-detail"><span>⌖</span><div><small>ADDRESS</small><b>Add verified institution address</b></div></div><div class="contact-detail"><span>◷</span><div><small>OFFICE HOURS</small><b>Add official office hours</b></div></div></div><form id="contact-form" class="form-card"><h3>Send a message</h3><label>Your name<input class="field" name="name" required maxlength="80"></label><label>Email address<input class="field" name="email" type="email" required maxlength="120"></label><label>Subject<input class="field" name="subject" required maxlength="120"></label><label>Message<textarea class="field" name="message" rows="5" required maxlength="1000"></textarea></label><button class="btn primary full" type="submit">Save message on this device ↗</button><p class="form-status" aria-live="polite"></p></form></section></main><div id="site-footer"></div><script src="assets/app.js"></script></body></html>
